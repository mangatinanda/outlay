<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept A — Mosaic O
  ────────────────────
  A bold "O" letter mark (Outlay's leading letter) cast as a rose ring,
  with four small saffron tile accents at compass points — echoing the
  rhythmic yellow squares dotted along the home's parapet band.

  Palette: rose-pink (trim) · cream (body) · saffron (accent tiles)
  Reads at: 16px favicon → 512px PWA tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cream "tile" background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="#f7eecf"/>

  <!-- Bold rose ring (the O) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#d97da2" stroke-width="64"/>

  <!-- Four small saffron tile accents at compass points — the parapet rhythm -->
  <g fill="#f4c542">
    <rect x="240" y="60"  width="32" height="32" rx="3"/>
    <rect x="240" y="420" width="32" height="32" rx="3"/>
    <rect x="60"  y="240" width="32" height="32" rx="3"/>
    <rect x="420" y="240" width="32" height="32" rx="3"/>
  </g>
</svg>
