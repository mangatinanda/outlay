<?xml version="1.0" encoding="UTF-8"?>
<!--
  Outlay rich logo — A3 "Mosaic O · Rupee + Parapet Tiles"
  ────────────────────────────────────────────────────────
  Same Mosaic O as the app icon, but with four saffron tile accents at
  compass points — echoing the rhythmic yellow squares dotted along the
  CLSN Home parapet. Used at large sizes (login, onboarding splash,
  dashboard chrome) where the extra detail reads. The plain A1 icon is
  used for small sizes (favicon, PWA tile).

  Source palette pulled from the home photos:
    cream    #f7eecf  · background tile
    rose     #d97da2  · O ring (parapet trim)
    ink      #1a1a1a  · rupee glyph
    saffron  #f4c542  · parapet tile accents
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Outlay">
  <rect width="512" height="512" rx="108" fill="#f7eecf"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#d97da2" stroke-width="64"/>
  <g fill="#f4c542">
    <rect x="240" y="60"  width="32" height="32" rx="3"/>
    <rect x="240" y="420" width="32" height="32" rx="3"/>
    <rect x="60"  y="240" width="32" height="32" rx="3"/>
    <rect x="420" y="240" width="32" height="32" rx="3"/>
  </g>
  <g transform="translate(136 136) scale(10)" fill="none" stroke="#1a1a1a"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12"/>
    <path d="M6 8h12"/>
    <path d="m6 13 8.5 8"/>
    <path d="M6 13h3"/>
    <path d="M9 13c6.667 0 6.667-10 0-10"/>
  </g>
</svg>
