name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # GitHub deprecates Node 20 action runtimes (removed Sept 2026); force
      # remaining Node-20 actions (pnpm/action-setup) onto Node 24 now.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      # No version pin here — pnpm/action-setup reads it from package.json's
      # `packageManager` field (pnpm@11.5.2). Specifying both errors out.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The build runs no queries (pages are force-dynamic) and needs no
          # real auth credentials; a dummy secret keeps Auth.js initialization
          # happy. The libSQL client still opens its connection eagerly at
          # import time, so point it at an in-memory database instead of the
          # default file path (the gitignored data/ dir doesn't exist in CI).
          AUTH_SECRET: ci-only-dummy-secret
          DATABASE_URL: ":memory:"

  # Non-blocking: runs in parallel with `ci` (no `needs`) and never fails the
  # overall check (continue-on-error). e2e is a signal, not a gate, while the
  # suite is young; promote to blocking later by removing continue-on-error.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Match the `ci` job: force remaining Node-20 actions onto Node 24.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      # No version pin here — pnpm/action-setup reads it from package.json's
      # `packageManager` field (pnpm@11.5.2). Specifying both errors out.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          CI: "true"
          DATABASE_URL: file:./data/e2e.db
          AUTH_SECRET: e2e-secret
          HOUSEHOLD_PASSCODE: e2e-pass

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
